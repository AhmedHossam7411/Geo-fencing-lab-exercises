<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 3B · Geofenced Transfer</title>
<style>
:root{
  --navy:#14213D; --navy-2:#22304F; --teal:#1F7A6D; --teal-soft:#E3EEEA; --cream:#F5F4EF;
  --card:#FDFCF8; --line:#E3E1DA; --ink:#14213D; --body:#3F4A5C; --muted:#5F6673;
  --amber:#9A5B12; --amber-soft:#F8EBD8; --red:#A33224; --red-soft:#F8E1DC; --gray:#6B7078; --gray-soft:#ECEBE6;
  --mono:Consolas,"Cascadia Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
header{background:var(--navy);color:#F5F4EF;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header .brand{font-weight:700;letter-spacing:.3px;font-size:17px}
header .brand span{color:#E8A04C;font-weight:600;letter-spacing:2px;text-transform:uppercase;font-size:12px;margin-right:10px}
header .who{margin-left:auto;font-size:14px;color:#C5CFDD}
.app{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,1.05fr);gap:20px;padding:20px 24px;align-items:start}
nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--body)}
nav button:hover{background:var(--card);border-color:var(--line)}
nav button.active{background:var(--card);border-color:var(--teal);color:var(--ink);font-weight:600}
nav .dot{width:12px;height:12px;border-radius:50%;border:2px solid #B9BCC2;flex:none}
nav .dot.started{border-color:var(--teal);background:var(--teal-soft)}
nav .dot.done{border-color:var(--teal);background:var(--teal)}
nav .group{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:12px 10px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--teal)}
h1{font-size:28px;line-height:1.15;margin:4px 0 8px}
h2{font-size:18px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.pill{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.pill.predict{background:var(--navy);color:#F5F4EF}
.pill.run{background:var(--teal);color:#F5F4EF}
.pill.explain{background:#F3DDBD;color:var(--navy)}
p{margin:0 0 8px;color:var(--body)}

.actions{display:flex;flex-direction:column;gap:8px}

.btn{border:none;border-radius:9px;padding:8px 16px;font-weight:600;cursor:pointer;background:var(--teal);color:#fff;white-space:nowrap}

.console{background:var(--navy);color:#E9EDF3;border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px;min-height:52px}
.console .empty{color:#8E9AB0;font-style:italic}
.console .line{display:flex;gap:8px;align-items:flex-start}
.console .ico{flex:none;width:18px;text-align:center}

.console .warn{color:#FFD9A8}
.console .warn .ico{color:#F2A54A}
.console .step{color:#8E9AB0;font-family:var(--mono);font-size:12.5px;margin-top:6px}
.console pre{margin:0;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-all;color:#C9F0E3}

.footer-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
aside.system{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px;min-width:0}

.keys{display:flex;flex-wrap:wrap;gap:6px}

.k-plain{background:var(--red-soft);color:var(--red)}
.k-ok{background:var(--teal-soft);color:var(--teal)}

.k-orphanlog{background:var(--gray-soft);color:var(--gray)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:11.5px}
.detail{display:flex;flex-direction:column;gap:8px}

.chip.tok{font-family:var(--mono)}
.chip.k-dead{text-decoration:line-through}
.panel-list{display:flex;flex-direction:column;gap:4px;font-size:13px}
.panel-list .mono{font-family:var(--mono);font-size:12px;word-break:break-all}
.note{font-size:13px;color:var(--muted)}
.welcome p{font-size:15.5px}
.welcome ol{color:var(--body);padding-left:20px;margin:6px 0 10px}
.welcome li{margin:4px 0}
input.name{border:1px solid #CFCCC3;border-radius:10px;padding:9px 12px;width:min(380px,100%);background:#fff}
.status-list{display:flex;flex-direction:column;gap:4px;font-size:14px}
.status-list .row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}
.status-list .yes{color:var(--teal);font-weight:600}
.status-list .no{color:var(--amber);font-weight:600}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
table.grid.payload .cell{min-width:0;white-space:normal}
.wire .cell{white-space:normal} .card{min-width:0}
.grid-wrap{max-width:100%} aside.system,main{max-width:100%}
.act code{overflow-wrap:anywhere}
.k-token{background:var(--teal-soft);color:var(--teal);font-family:var(--mono)}
.k-gen{background:var(--amber-soft);color:var(--amber)}
.k-drop{color:#A4A7AD;font-style:italic}
.k-cipher{background:var(--gray-soft);color:var(--gray);font-family:var(--mono)}
.key.leak{background:var(--red-soft);border-color:#E9B9B0;color:var(--red)}
.key.rel{background:var(--amber-soft);border-color:#EBCF9F}
.regions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.region{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;min-width:0}
.region h4{margin:0 0 6px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink)}
.region .sub{font-size:11.5px;color:var(--muted);margin:8px 0 3px}
.wire{font-size:12.5px;color:var(--muted);margin:0 0 8px}
table.matrix{border-collapse:collapse;width:100%;font-size:13px}
table.matrix th{font-size:11.5px;color:var(--muted);text-align:left;font-weight:600;padding:4px 6px}
table.matrix td{padding:4px 6px;border-top:1px solid var(--line)}
table.matrix .how{display:block;font-size:11px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:12.5px}
.bar{position:relative;height:20px;background:var(--gray-soft);border-radius:6px;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bar .fill.fail{background:#E7A99C}
.bar .fill.pass{background:#8CC9B9}
.bar .thr{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--navy)}
.bar .val{position:absolute;right:6px;top:1px;font-weight:700;color:var(--ink)}
@media (max-width:1180px){
  .app{grid-template-columns:1fr}
  nav{position:static;flex-direction:row;flex-wrap:wrap}
  nav .group{display:none}
  aside.system{position:static}
}
@media (max-width:560px){ .regions{grid-template-columns:1fr} .app{padding:16px} }
</style>

<body>
<header>
  <div class="brand"><span>Data Privacy · Lab 3B</span>Geofenced Transfer: the VitaLink simulation</div>
  <div class="who" id="who"></div>
</header>
<div class="app">
  <nav id="nav"></nav>
  <main id="main"></main>
  <aside class="system" id="system"></aside>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   Scenario data (same VitaLink patients as Lab 3A)
   ========================================================================= */
const PATIENTS = [
  {patient_id:"P001", name:"Anna Becker",     email:"anna.becker@mail.de",     zip:"10115", dob:"1985-03-12", sex:"F", diagnosis:"Asthma",                    clinic_region:"EU"},
  {patient_id:"P002", name:"Luca Rossi",      email:"luca.rossi@mail.it",      zip:"20121", dob:"1972-11-02", sex:"M", diagnosis:"Hypertension",              clinic_region:"EU"},
  {patient_id:"P003", name:"Sofia Lindqvist", email:"sofia.lindqvist@mail.se", zip:"11122", dob:"1990-07-24", sex:"F", diagnosis:"Major depressive disorder", clinic_region:"EU"},
  {patient_id:"P004", name:"James Carter",    email:"james.carter@mail.com",   zip:"02139", dob:"1968-01-30", sex:"M", diagnosis:"Asthma",                    clinic_region:"US"},
  {patient_id:"P005", name:"Maria Lopez",     email:"maria.lopez@mail.com",    zip:"90012", dob:"1995-05-17", sex:"F", diagnosis:"Type 2 diabetes",           clinic_region:"US"},
  {patient_id:"P006", name:"David Kim",       email:"david.kim@mail.com",      zip:"60601", dob:"1980-09-09", sex:"M", diagnosis:"Migraine",                  clinic_region:"US"},
];
const P = id => PATIENTS.find(p => p.patient_id === id);
const EIDS = PATIENTS.filter(p => p.clinic_region === "EU").map(p => p.patient_id);   // P001, P002, P003
const COLS = ["subject","zip","dob","sex","diagnosis"];
/* A public running-club member list: the outside dataset an analyst can join with */
const RUNNERS = [
  {name:"Anna Becker",     zip:"10115", dob:"1985-03-12", sex:"F"},
  {name:"Jonas Weber",     zip:"10117", dob:"1985-08-30", sex:"M"},
  {name:"Mia Schulz",      zip:"10119", dob:"1985-01-04", sex:"F"},
  {name:"Luca Rossi",      zip:"20121", dob:"1972-11-02", sex:"M"},
  {name:"Marco Bianchi",   zip:"20123", dob:"1972-04-18", sex:"M"},
  {name:"Sofia Lindqvist", zip:"11122", dob:"1990-07-24", sex:"F"},
  {name:"Elin Berg",       zip:"11120", dob:"1990-02-11", sex:"F"},
  {name:"Oskar Nilsson",   zip:"11129", dob:"1990-12-01", sex:"M"},
  {name:"Hanna Koch",      zip:"50667", dob:"1979-06-21", sex:"F"},
  {name:"Pedro Alves",     zip:"11000", dob:"1988-10-05", sex:"M"},
];
const BILLING = {P001:"€42.00", P002:"€42.00", P003:"€65.00"};

/* =========================================================================
   Byte helpers, SHA-256 and HMAC (self-contained, works offline)
   ========================================================================= */
const utf8 = new TextEncoder();
function randBytes(n){ const b = new Uint8Array(n); crypto.getRandomValues(b); return b; }
function concat(...parts){ const len = parts.reduce((a,p)=>a+p.length,0); const out = new Uint8Array(len); let o=0; for(const p of parts){ out.set(p,o); o+=p.length; } return out; }
function b64url(bytes){ let s=""; for(const x of bytes) s+=String.fromCharCode(x); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_"); }
function unb64url(str){ const s = atob(str.replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(s, c => c.charCodeAt(0)); }
function hex(bytes){ return Array.from(bytes, b => b.toString(16).padStart(2,"0")).join(""); }
function isPrime(n){ for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true; }
function firstPrimes(count){ const out=[]; for(let n=2; out.length<count; n++) if(isPrime(n)) out.push(n); return out; }
const SHA_K = firstPrimes(64).map(p => Math.floor((Math.cbrt(p) % 1) * 4294967296) >>> 0);
const SHA_H = firstPrimes(8).map(p => Math.floor((Math.sqrt(p) % 1) * 4294967296) >>> 0);
function ror(x,n){ return (x>>>n) | (x<<(32-n)); }
function sha256(msg){
  const l = msg.length, padLen = ((l + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(padLen); m.set(msg); m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(padLen-8, Math.floor(l / 0x20000000)); dv.setUint32(padLen-4, (l << 3) >>> 0);
  const H = SHA_H.slice(), w = new Uint32Array(64);
  for(let o=0; o<padLen; o+=64){
    for(let i=0;i<16;i++) w[i] = dv.getUint32(o + i*4);
    for(let i=16;i<64;i++){
      const a=w[i-15], b=w[i-2];
      const s0 = ror(a,7) ^ ror(a,18) ^ (a>>>3), s1 = ror(b,17) ^ ror(b,19) ^ (b>>>10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for(let i=0;i<64;i++){
      const S1 = ror(e,6) ^ ror(e,11) ^ ror(e,25), ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + SHA_K[i] + w[i]) >>> 0;
      const S0 = ror(a,2) ^ ror(a,13) ^ ror(a,22), mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  const out = new Uint8Array(32), odv = new DataView(out.buffer);
  H.forEach((x,i) => odv.setUint32(i*4, x));
  return out;
}
function hmac(key, msg){
  let k = key.length > 64 ? sha256(key) : key;
  const block = new Uint8Array(64); block.set(k);
  const ipad = block.map(b => b ^ 0x36), opad = block.map(b => b ^ 0x5c);
  return sha256(concat(opad, sha256(concat(ipad, msg))));
}
const sha256hex = str => hex(sha256(utf8.encode(str)));
const hmacHex = (key, str) => hex(hmac(typeof key === "string" ? utf8.encode(key) : key, utf8.encode(str)));

/* Fernet-shaped tokens. Real Fernet layout: version(1) | timestamp(8) | IV(16) | ciphertext | HMAC(32).
   The simulation never needs to decrypt: whether a token is readable is decided by whether its key exists. */
function newKey(){ return b64url(randBytes(32)); }
function makeToken(text){
  const ctLen = (Math.floor(utf8.encode(text).length / 16) + 1) * 16;
  const ts = new Uint8Array(8); new DataView(ts.buffer).setUint32(4, Math.floor(Date.now()/1000));
  return b64url(concat(new Uint8Array([0x80]), ts, randBytes(16), randBytes(ctLen), randBytes(32)));
}
function tokenSeconds(token){ const b = unb64url(token), dv = new DataView(b.buffer); return dv.getUint32(1) * 4294967296 + dv.getUint32(5); }
const fp = key => sha256hex(key).slice(0,16);
const short = (tok, n=14) => tok.length > n ? tok.slice(0,n) + "…" : tok;

/* =========================================================================
   The simulated transfer: EU origin, the wire, the US analytics backend
   ========================================================================= */
function newSystem(opts = {}){
  const s = {tokenMode:null, secret:b64url(randBytes(32)), tokens:{}, tokenMap:{}, purposeScoped:false,
             euKms:{}, usKms:{}, usTags:{}, gone:[], batchKey:null, perPatient:false, ppKeys:{},
             encrypted:false, ct:{}, sent:false, batches:0, generalize:false, dropSex:false,
             releases:[], usRead:false, secretInUS:false, linkKnown:false, errorLog:[], extra:{}, panel:null, risk:[]};
  if(opts.tok) tokenize(s, "hmac");
  if(opts.enc){ makeKms(s); encryptBatch(s); }
  if(opts.send) send(s);
  if(opts.release){ releaseKey(s, "us-analytics", "chronic-disease outcomes study"); }
  if(opts.read) s.usRead = true;
  return s;
}
function tokenFor(s, pid, purpose){
  if(s.tokenMode === "sha") return sha256hex(pid);
  return hmacHex(s.secret, s.purposeScoped ? `${purpose || "analytics"}:${pid}` : pid);
}
function tokenize(s, mode){
  s.tokenMode = mode; s.tokens = {}; s.tokenMap = {};
  EIDS.forEach(pid => { const t = tokenFor(s, pid, "analytics"); s.tokens[pid] = t; if(mode === "hmac") s.tokenMap[t] = pid; });
}
function makeKms(s){ s.euKms = {transfer: newKey()}; s.usKms = {}; s.usTags = {}; s.batchKey = s.euKms.transfer; }
const keyFor = (s, pid) => s.perPatient ? s.ppKeys[pid] : s.batchKey;
const euHas  = (s, pid) => Object.values(s.euKms).includes(keyFor(s, pid));
const usHas  = (s, pid) => Object.values(s.usKms).includes(keyFor(s, pid));
function payloadRecord(s, pid){
  const p = P(pid), r = {};
  if(s.tokenMode) r.token = s.tokens[pid]; else { r.patient_id = p.patient_id; r.name = p.name; r.email = p.email; }
  r.zip = s.generalize ? p.zip.slice(0,3) + "**" : p.zip;
  r.dob = s.generalize ? p.dob.slice(0,4) : p.dob;
  if(!(s.generalize || s.dropSex)) r.sex = p.sex;
  r.diagnosis = p.diagnosis;
  return r;
}
function encryptBatch(s){ s.encrypted = true; EIDS.forEach(pid => s.ct[pid] = makeToken(JSON.stringify(payloadRecord(s, pid)))); }
function send(s){ s.sent = true; s.batches++; }
function releaseKey(s, to, purpose){
  s.usKms.transfer = s.batchKey; s.usTags.transfer = "released";
  const r = {key:"transfer", key_fingerprint: fp(s.batchKey), released_to: to, purpose, approved_by:"EU DPO", released_at: new Date().toISOString().slice(0,19) + "Z", expires:"24h"};
  s.releases.push(r); return r;
}
function destroyKey(s, key){
  for(const n in s.euKms) if(s.euKms[n] === key){ s.gone.push({side:"EU", name:n, key}); delete s.euKms[n]; }
  for(const n in s.usKms) if(s.usKms[n] === key){ s.gone.push({side:"US", name:n, key}); delete s.usKms[n]; delete s.usTags[n]; }
}
/* Who can recover what from the payload */
function content(s, party, pid){
  if(!s.sent) return false;
  if(!s.encrypted) return true;
  if(party === "eu") return euHas(s, pid);
  if(party === "us") return usHas(s, pid) || (s.usRead && !!keyFor(s, pid));
  return false;
}
function identity(s, party, pid){
  if(!content(s, party, pid)) return null;
  if(!s.tokenMode) return "name in clear";
  if(party === "eu") return s.tokenMap[s.tokens[pid]] ? "eu_token_map" : "secret + guessing";
  if(s.tokenMode === "sha") return "hash reversed";
  if(party === "us" && s.secretInUS) return "copied secret";
  if(s.linkKnown && !s.generalize && !s.dropSex) return "ZIP + birth date + sex";
  return null;
}
const countC = (s, party) => EIDS.filter(pid => content(s, party, pid)).length;
const countI = (s, party) => EIDS.filter(pid => identity(s, party, pid)).length;

/* Attacks */
function guessIds(target, f){
  for(let i=1;i<1000;i++){ const g = "P" + String(i).padStart(3,"0"); if(f(g) === target) return {id:g, n:i}; }
  return null;
}
function guessReport(s, f){
  return EIDS.map(pid => { const t = s.tokens[pid], r = guessIds(t, f);
    return `${short(t,16)}  →  ${r ? `${r.id} after ${r.n} guesses` : "no match after 999 guesses"}`; });
}
function linkRunners(rec, generalized){
  return RUNNERS.filter(x => generalized
    ? x.zip.slice(0,3) + "**" === rec.zip && x.dob.slice(0,4) === rec.dob
    : x.zip === rec.zip && x.dob === rec.dob && x.sex === rec.sex).map(x => x.name);
}
const usRecords = s => EIDS.map(pid => payloadRecord(s, pid));

/* =========================================================================
   Output helpers for the console
   ========================================================================= */
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ok   = t => `<div class="line ok"><span class="ico">✓</span><span>${t}</span></div>`;
const warn = t => `<div class="line warn"><span class="ico">⚠</span><span>${t}</span></div>`;
const info = t => `<div class="line"><span class="ico">›</span><span>${t}</span></div>`;
const pre  = t => `<pre>${esc(t)}</pre>`;
const jsonl = rows => rows.map(r => JSON.stringify(r)).join("\n");
const shortRec = r => { const o = Object.assign({}, r); if(o.token) o.token = short(o.token, 16); return o; };

function riskRow(s, name, e, se, sg){
  const score = (e * se) / sg; s.risk.push({name, e, se, sg, score});
  return info(`${name}: Risk = ${e} × ${se} ÷ ${sg} = <b>${score.toFixed(2)}</b> → <b>${score > 5 ? "BLOCKED" : "PASS"}</b> (threshold 5)`);
}
function joinBilling(s){
  if(!s.extra.billing) return [];
  return s.extra.billing.map(b => { const pid = EIDS.find(id => s.tokens[id] === b.token); return pid ? {name:b.name, diagnosis:P(pid).diagnosis} : null; }).filter(Boolean);
}

   ========================================================================= */
const STORE_KEY = "lab3b-geofenced-transfer-answers-v1";
let store = {name:"", answers:{}};
try { const raw = localStorage.getItem(STORE_KEY); if(raw) store = Object.assign(store, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e) {} }
function ans(id){ return store.answers[id] || (store.answers[id] = {predict:"", locked:false, explains:[], ran:false}); }
const MIN = 15;
const filled = t => (t || "").trim().length >= MIN;
function stepStatus(st){
  const a = store.answers[st.id]; if(!a) return "";
  if(a.ran && filled(a.predict) && st.explains.every((_,i) => filled(a.explains[i]))) return "done";
  return (a.predict || a.ran) ? "started" : "";
}

let current = "start", sys = null, ran = 0, output = [];

  });
  html += `<div class="group">Finish</div><button data-go="finish" class="${current==="finish"?"active":""}"><span class="dot"></span>Hand in answers</button>`;

}

function go(id){
  current = id; ran = 0; output = [];
  const st = STEPS.find(s => s.id === id);
  sys = st ? st.setup() : null;
  render(); window.scrollTo(0,0);
}

function render(){
  renderNav();
  if(current === "start") return renderStart();

}

function renderActions(){
  const st = STEPS.find(s => s.id === current), a = ans(st.id);
  const canStart = a.locked || filled(a.predict);
  $("predict").disabled = a.locked;
  $("predictNote").innerHTML = a.locked ? `<div class="locked">🔒 Prediction locked. It stays as you wrote it, even if it was wrong.</div>`
                                        : `<div class="hint">Write at least one full sentence to unlock the actions. Wrong predictions are fine.</div>`;
  $("actions").innerHTML = st.actions.map((act,i) => `
    <div class="act ${i < ran ? "done" : ""}">
      <span class="n">${i < ran ? "✓" : i+1}</span>
      <div class="lbl">${act.label}<code>${esc(act.code)}</code></div>
      <button class="btn" data-act="${i}" ${(i !== ran || !canStart) ? "disabled" : ""}>${i < ran ? "Done" : "Run"}</button>
    </div>`).join("");
  $("actions").querySelectorAll("button[data-act]").forEach(b => b.onclick = () => runAction(+b.dataset.act));
  const allRan = ran >= st.actions.length || a.ran;
  document.querySelectorAll("textarea[data-ex]").forEach(t => t.disabled = !allRan);
  $("explainNote").textContent = allRan ? "" : "These unlock after you have run every action.";
}

function runAction(i){
  const st = STEPS.find(s => s.id === current), a = ans(st.id);
  if(i === 0){ a.locked = true; }
  output.push(`<div class="step">› ${esc(st.actions[i].code)}</div>`, ...st.actions[i].run(sys));
  ran = i + 1;
  if(ran >= st.actions.length) a.ran = true;
  save(); renderActions(); renderConsole(); renderSystem(); renderNav();
}

function renderConsole(){
  $("console").innerHTML = output.length ? output.join("") : `<span class="empty">Output appears here when you run an action.</span>`;
}

function kmsChips(s, kms, side){
  const live = Object.entries(kms).map(([n,k]) => {
    const tag = side === "US" ? s.usTags[n] : "";
    const cls = tag === "replica" ? "leak" : tag === "released" ? "rel" : "";
    return `<span class="key ${cls}"><b>${esc(n)}</b> <span class="fp">${fp(k).slice(0,10)}</span>${tag ? ` · ${tag}` : ""}</span>`;
  });
  const dead = s.gone.filter(g => g.side === side).map(g => `<span class="key gone"><b>${esc(g.name)}</b> destroyed</span>`);
  return live.concat(dead).join("") || `<span class="note">empty</span>`;
}

function cellFor(s, pid, col){
  const r = payloadRecord(s, pid), p = P(pid);
  if(col === "subject"){
    if(s.tokenMode) return `<span class="cell k-token" title="${r.token}">${short(r.token,10)}</span>`;
    return `<span class="cell k-plain">${esc(p.name)}</span>`;
  }
  if(!(col in r)) return `<span class="cell k-drop">dropped</span>`;
  const gen = s.generalize && (col === "zip" || col === "dob");
  return `<span class="cell ${gen ? "k-gen" : "k-plain"}">${esc(r[col])}</span>`;
}

function renderSystem(){
  const s = sys;
  const secretEU = s.tokenMode === "hmac" ? `<span class="key"><b>token secret</b> <span class="fp">${fp(s.secret).slice(0,10)}</span></span>`
                 : s.tokenMode === "sha" ? `<span class="note">no secret (plain SHA-256)</span>` : `<span class="note">not tokenized yet</span>`;
  const secretUS = s.secretInUS ? `<span class="key leak"><b>token secret</b> <span class="fp">${fp(s.secret).slice(0,10)}</span> · copied</span>` : `<span class="note">none</span>`;
  const mapEntries = Object.entries(s.tokenMap);
  const map = mapEntries.length ? mapEntries.map(([t,pid]) => `<span class="key"><span class="fp">${short(t,8)}</span> → <b>${pid}</b></span>`).join("") : `<span class="note">empty</span>`;
  const usData = !s.sent ? "nothing received" : !s.encrypted ? "3 records, plaintext" : s.usRead ? "3 ciphertexts + decrypted study table" : "3 ciphertexts";
  const enc = !s.encrypted ? `<span class="cell k-plain">not encrypted</span>`
            : `<span class="cell k-cipher">🔒 whole record encrypted with ${s.perPatient ? "one key per patient" : `transfer key ${fp(s.batchKey).slice(0,10)}`}</span>`;
  const head = `<tr><th>EU patient</th>${COLS.map(c => `<th>${c === "subject" ? "identity" : c}</th>`).join("")}</tr>`;

      }).join("")}</table>`;
  $("system").innerHTML = `
    <div class="card"><h3>Two regions</h3><div class="regions">
      <div class="region"><h4>🇪🇺 EU origin</h4>

      <div class="region"><h4>🇺🇸 US analytics backend</h4>
        <div class="sub">us_kms</div><div class="keys">${kmsChips(s, s.usKms, "US")}</div>
        <div class="sub">secrets in config</div><div class="keys">${secretUS}</div>
        <div class="sub">data held</div><div class="note">${usData}</div></div>
    </div></div>
    <div class="card"><h3>Transfer payload · ${s.sent ? `sent (${s.batches} batch${s.batches === 1 ? "" : "es"})` : "prepared, not sent"}</h3>
      <p class="wire">${enc}</p>
      <div class="grid-wrap"><table class="grid payload">${head}${rows}</table></div>
      <div class="legend"><span class="cell k-plain">plaintext</span><span class="cell k-token">token</span><span class="cell k-gen">generalized</span><span class="cell k-drop">dropped</span></div>
      <p class="note" style="margin-top:6px">The table shows each record before encryption. A token replaces patient_id, name and email.</p></div>
    <div class="card"><h3>Who can recover what · from the payload</h3>${matrix}</div>
    ${s.panel ? `<div class="card">${s.panel(s)}</div>` : ""}`;
}

function answersText(){
  const lines = ["Lab 3B - Geofencing + Pseudonymized Transfer: answers", `Name: ${store.name || "(not given)"}`, `Saved: ${new Date().toLocaleString()}`, ""];

  $("copy").onclick = copyAll;
  $("dl").onclick = () => {
    const blob = new Blob([answersText()], {type:"text/plain"}), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `Lab3B_${(store.name || "answers").replace(/[^A-Za-z0-9]+/g,"_")}.txt`;
    document.body.appendChild(a); a.click(); a.remove(); toast("Downloaded. Check your Downloads folder.");
  };
}

function copyAll(){
  const t = $("all"); t.value = answersText();
  const fallback = () => { t.focus(); t.select(); let done = false; try { done = document.execCommand("copy"); } catch(e) {}
    toast(done ? "Copied. Paste it into Notepad with Ctrl+V." : "Select the text below and press Ctrl+C."); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t.value).then(() => toast("Copied. Paste it into Notepad with Ctrl+V."), fallback);
  else fallback();
}
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2600); }

render();
</script>
</body>
</html>
